[project]
name = "mcp-ops-server"
version = "0.1.0"
description = "MCP server giving Claude safe, typed access to an orders/customers/tickets database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcp-ops-server = "ops_server.__main__:main"

[tool.setuptools]
packages = ["ops_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:asyncio"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D205", "D213", "D212", "D401", "D413"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
